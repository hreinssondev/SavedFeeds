name: SavedFeeds
options:
  bundleIdPrefix: com.hreinsson
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 8FB39RNRQQ
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  SavedFeeds:
    type: application
    platform: macOS
    sources:
      - SavedFeeds
    dependencies:
      - target: SavedFeedsSafari
    entitlements:
      path: SavedFeeds/SavedFeeds.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.hreinsson.SavedFeeds
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hreinsson.SavedFeeds.sessions
    info:
      path: SavedFeeds/Info.plist
      properties:
        CFBundleDisplayName: SavedFeeds
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.social-networking
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: © 2026 Hlynur Hreinsson
        SessionGroup: $(TeamIdentifierPrefix)com.hreinsson.SavedFeeds
        KeychainGroup: $(AppIdentifierPrefix)com.hreinsson.SavedFeeds.sessions
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.SavedFeeds
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - SavedFeedsTests
  SavedFeedsSafari:
    type: app-extension
    platform: macOS
    sources:
      - SafariExtension/Handler
      - path: SafariExtension/Resources
        buildPhase: resources
      - SavedFeeds/Core/SharedSessions.swift
    entitlements:
      path: SafariExtension/SavedFeedsSafari.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.hreinsson.SavedFeeds
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: SavedFeeds Session
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHumanReadableCopyright: © 2026 Hlynur Hreinsson
        SessionGroup: $(TeamIdentifierPrefix)com.hreinsson.SavedFeeds
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.SavedFeeds.Safari
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
  SavedFeedsiOS:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - SavediOS
      - SavedFeeds/Core
      - SavedFeeds/AppIcon.icon
      - SavedFeeds/Assets.xcassets
      # The post views are shared with the Mac app.
      - SavedFeeds/UI/PostCard.swift
      - SavedFeeds/UI/CommentsSection.swift
      - SavedFeeds/UI/MediaView.swift
      - SavedFeeds/UI/FeedZoom.swift
      - SavedFeeds/UI/OpenedPost.swift
      - SavedFeeds/UI/ServiceStyle.swift
      - SavedFeeds/UI/SignInSheet.swift
    entitlements:
      path: SavediOS/SavedFeedsiOS.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.hreinsson.SavedFeeds.sessions
    info:
      path: SavediOS/Info.plist
      properties:
        CFBundleDisplayName: SavedFeeds
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        KeychainGroup: $(AppIdentifierPrefix)com.hreinsson.SavedFeeds.sessions
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.SavedFeedsiOS
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme: {}
  SavedFeedsTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SavedFeedsTests
    dependencies:
      - target: SavedFeeds
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hreinsson.SavedFeedsTests
